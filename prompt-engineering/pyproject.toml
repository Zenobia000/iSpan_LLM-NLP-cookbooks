[project]
name = "ispan-prompt-engineering"
version = "2026.6.0"
description = "iSpan AI 可控性工程課程 — prompt-engineering 模組（多模型並陳：OpenAI / Claude / Gemini）"
readme = "README.md"
requires-python = ">=3.10"

# 版本以 2026-06 線上查證為準（見 docs/reviews/2026-06-24-prompt-engineering-teaching-review.md）。
# 已禁用：pysqlite3 / PyPDF2 / google-generativeai / fitz（皆為棄用或假套件）。
dependencies = [
    # --- LLM providers（多模型並陳）---
    "openai>=2.26,<3",          # openai-agents 需要 >=2.26；Responses API 為 2026 主線
    "anthropic>=0.111,<1",
    "google-genai>=2.0,<3",     # 取代已 EOL 的 google-generativeai
    "openai-agents>=0.17,<1",
    "cohere>=7.0,<8",
    # --- LangChain 1.x（create_agent 跑在 langgraph 上）---
    "langchain>=1.3,<2",
    "langchain-openai>=0.3,<1",
    "langchain-text-splitters>=0.3",
    "langgraph>=1.2,<2",
    # --- RAG / 向量庫 / 嵌入 ---
    "chromadb>=1.5,<2",
    "sentence-transformers>=3.0",
    "tiktoken>=0.13,<1",
    # --- 文件解析 ---
    "pymupdf>=1.24,<2",         # import pymupdf（非 fitz）
    "pypdf>=5.0,<7",            # 取代 PyPDF2
    # --- 結構化 / 驗證 ---
    "pydantic>=2.10,<3",
    # --- 工具 / 搜尋 ---
    "tavily-python>=0.7,<1",
    "googlesearch-python>=1.3,<2",
    "numexpr>=2.8,<3",
    # --- UI ---
    "gradio>=6.0,<7",
    # --- 評估 / 觀測 ---
    "braintrust>=0.24,<1",
    "autoevals>=0.0.130,<0.1",
    # --- 基礎 ---
    "python-dotenv>=1.0",
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "nest-asyncio>=1.6",
    "ipykernel>=6.29",
]

[tool.uv]
# 純定版解析；不綁定特定 index。學員以 `uv sync` 安裝。
package = false
